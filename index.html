  <script>
    /* 多主题 + 护眼 + 字号：首帧前从 localStorage 恢复三态，防闪烁 */
    (function () {
      var THEMES = ['red', 'red-white', 'blue-white', 'patriotic', 'deep-blue', 'original'];
      var NAMES = { 'red': '红色法治', 'red-white': '红白', 'blue-white': '蓝白',
                    'patriotic': '爱国爱党', 'deep-blue': '深蓝', 'original': '原版' };
      var root = document.documentElement;
      function validTheme(t) { return THEMES.indexOf(t) >= 0 ? t : 'red'; }
      function validFont(f) { return (f === 'lg' || f === 'xl') ? f : 'std'; }
      function read(k, def) { try { var v = localStorage.getItem(k); return v === null ? def : v; } catch (e) { return def; } }
      var theme = validTheme(read('kh_theme', 'red'));
      var font = validFont(read('kh_font', 'std'));
      var eyecare = (read('kh_eyecare', '0') === '1') ? 'on' : 'off';
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-font', font);
      root.setAttribute('data-eyecare', eyecare);
      window.KH = window.KH || {};
      window.KH.THEMES = THEMES;
      window.KH.NAMES = NAMES;
      window.KH.applyTheme = function (name) {
        name = validTheme(name);
        root.setAttribute('data-theme', name);
        try { localStorage.setItem('kh_theme', name); } catch (e) {}
        var lab = document.getElementById('themeToggleLabel');
        if (lab) lab.textContent = NAMES[name];
      };
      window.KH.setEyeCare = function (on) {
        var v = on ? 'on' : 'off';
        root.setAttribute('data-eyecare', v);
        try { localStorage.setItem('kh_eyecare', on ? '1' : '0'); } catch (e) {}
      };
      window.KH.setFont = function (size) {
        size = validFont(size);
        root.setAttribute('data-font', size);
        try { localStorage.setItem('kh_font', size); } catch (e) {}
      };
      document.addEventListener('DOMContentLoaded', function () {
        var lab = document.getElementById('themeToggleLabel');
        if (lab) lab.textContent = NAMES[theme];
        var btn = document.getElementById('themeToggle');
        if (btn) btn.addEventListener('click', function () {
          var cur = validTheme(root.getAttribute('data-theme') || 'red');
          window.KH.applyTheme(THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]);
        });
      });
    })();
  </script>
  <script>
    /* 移动端汉堡菜单：点击展开/收起，切换路由后自动收起 */
    (function () {
      var btn = null, nav = null;
      function setOpen(open) {
        if (!nav) return;
        nav.classList.toggle('nav-open', open);
        if (btn) {
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          btn.setAttribute('aria-label', open ? '关闭菜单' : '打开菜单');
        }
        document.body.classList.toggle('nav-open-body', open);
      }
      document.addEventListener('DOMContentLoaded', function () {
        btn = document.getElementById('navToggleBtn');
        nav = document.getElementById('siteNav');
        if (!btn || !nav) return;
        btn.addEventListener('click', function () {
          setOpen(!nav.classList.contains('nav-open'));
        });
        window.addEventListener('hashchange', function () { setOpen(false); });
      });
    })();
  </script>
  <script>
    /* 登录模态框：ESC 键与点击遮罩关闭（复用 app.js 暴露的全局 closeAuthModal） */
    (function () {
      document.addEventListener('DOMContentLoaded', function () {
        var modal = document.getElementById('authModal');
        if (!modal) return;
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && modal.classList.contains('show')) closeAuthModal();
        });
        modal.addEventListener('click', function (e) {
          if (e.target === modal) closeAuthModal();
        });
      });
    })();
  </script>
